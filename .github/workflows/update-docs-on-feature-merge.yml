name: Update Docs on Feature Merge

on:
  pull_request:
    types: [closed]

jobs:
  update-docs:
    # Only run if the PR was merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find related feature specs
        id: changed-files
        run: |
          FEATURE_FILES=""

          # Strategy 1: Feature spec files directly changed in this PR
          CHANGED=$(git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.merge_commit_sha }} | grep '^docs/features/.*\.md$' | grep -v '_TEMPLATE.md' | grep -v 'README.md' || true)
          if [ -n "$CHANGED" ]; then
            echo "Feature specs changed in PR:"
            echo "$CHANGED"
            FEATURE_FILES="$CHANGED"
          fi

          # Strategy 2: Branch name matches a feature spec
          # e.g. feature/phone-reminders -> docs/features/phone-reminders.md
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "PR branch: $BRANCH"

          # Extract the slug after feature/ or fix/
          SLUG=$(echo "$BRANCH" | sed -n 's|^feature/\(.*\)|\1|p')
          if [ -n "$SLUG" ]; then
            SPEC_PATH="docs/features/${SLUG}.md"
            if [ -f "$SPEC_PATH" ]; then
              # Only add if not already in the list
              if ! echo "$FEATURE_FILES" | grep -q "$SPEC_PATH"; then
                echo "Feature spec matched by branch name: $SPEC_PATH"
                FEATURE_FILES=$(echo -e "${FEATURE_FILES}\n${SPEC_PATH}" | sed '/^$/d')
              fi
            else
              echo "No spec found for branch slug: $SPEC_PATH"
            fi
          fi

          # Output result
          if [ -z "$FEATURE_FILES" ]; then
            echo "No feature specs found"
            echo "has_features=false" >> $GITHUB_OUTPUT
          else
            echo "Feature specs to process:"
            echo "$FEATURE_FILES"
            FEATURE_FILES_SPACE=$(echo "$FEATURE_FILES" | tr '\n' ' ')
            echo "feature_files=$FEATURE_FILES_SPACE" >> $GITHUB_OUTPUT
            echo "has_features=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.changed-files.outputs.has_features == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.changed-files.outputs.has_features == 'true'
        run: |
          pip install anthropic

      - name: Generate documentation updates
        if: steps.changed-files.outputs.has_features == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/update_docs_from_feature.py ${{ steps.changed-files.outputs.feature_files }}

      - name: Check for changes
        if: steps.changed-files.outputs.has_features == 'true'
        id: check-changes
        run: |
          if git diff --quiet docs/ai/; then
            echo "No documentation changes generated"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Documentation changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changed-files.outputs.has_features == 'true' && steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update core documentation for new feature(s)"
          title: "docs: Update documentation for merged feature spec"
          body: |
            This PR was automatically generated after a feature spec was merged.

            ## What changed

            The following feature spec(s) were merged:
            ```
            ${{ steps.changed-files.outputs.feature_files }}
            ```

            ## Updated documents

            - `docs/ai/PROJECT_OVERVIEW.md`
            - `docs/ai/ARCHITECTURE.md`
            - `docs/ai/PRODUCT_PLAYBOOK.md`
            - `docs/ai/USER_JOURNEYS.md`

            ## Review checklist

            - [ ] Changes accurately reflect the new feature
            - [ ] Documentation style is consistent
            - [ ] No important details were missed
            - [ ] No existing content was incorrectly removed

            ---
            *Generated by the documentation update workflow*
          branch: docs/auto-update-${{ github.event.pull_request.number }}
          delete-branch: true
          labels: |
            documentation
            automated
