name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./agent
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/habits-agent:${{ github.sha }}

      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/habits-frontend:${{ github.sha }}

      - uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/habits-agent habits-agent=${{ secrets.DOCKERHUB_USERNAME }}/habits-agent:${{ github.sha }}
          kubectl set image deployment/habits-scheduler habits-scheduler=${{ secrets.DOCKERHUB_USERNAME }}/habits-agent:${{ github.sha }}
          kubectl set image deployment/habits-frontend habits-frontend=${{ secrets.DOCKERHUB_USERNAME }}/habits-frontend:${{ github.sha }}
          kubectl rollout status deployment/habits-agent --timeout=120s
          kubectl rollout status deployment/habits-scheduler --timeout=120s
          kubectl rollout status deployment/habits-frontend --timeout=120s
