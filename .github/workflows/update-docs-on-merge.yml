name: Update Docs on Merge

on:
  pull_request:
    types: [closed]

jobs:
  update-docs:
    # Only run if:
    # 1. PR was merged (not just closed)
    # 2. PR was NOT created by github-actions bot (avoid infinite loops)
    # 3. PR branch doesn't start with "docs/auto-update-" (belt and suspenders)
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      !startsWith(github.event.pull_request.head.ref, 'docs/auto-update-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR diff and find feature specs
        id: context
        run: |
          # Get the diff of what was merged
          git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.merge_commit_sha }} > /tmp/pr-diff.txt
          echo "diff_file=/tmp/pr-diff.txt" >> $GITHUB_OUTPUT

          # Check for any feature spec changes (bonus context)
          FEATURE_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.merge_commit_sha }} | grep '^docs/features/.*\.md$' | grep -v '_TEMPLATE.md' || true)
          if [ -n "$FEATURE_FILES" ]; then
            FEATURE_FILES_SPACE=$(echo "$FEATURE_FILES" | tr '\n' ' ')
            echo "feature_files=$FEATURE_FILES_SPACE" >> $GITHUB_OUTPUT
            echo "has_features=true" >> $GITHUB_OUTPUT
            echo "Feature specs found: $FEATURE_FILES"
          else
            echo "has_features=false" >> $GITHUB_OUTPUT
            echo "No feature specs in this PR"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate documentation updates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          FEATURE_ARGS=""
          if [ "${{ steps.context.outputs.has_features }}" = "true" ]; then
            FEATURE_ARGS="--feature-files ${{ steps.context.outputs.feature_files }}"
          fi

          python scripts/update_docs.py \
            --diff-file /tmp/pr-diff.txt \
            --pr-title "${{ github.event.pull_request.title }}" \
            $FEATURE_ARGS

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "No documentation changes generated"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Documentation changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update documentation for PR #${{ github.event.pull_request.number }}"
          title: "docs: Update documentation for PR #${{ github.event.pull_request.number }}"
          body: |
            This PR was automatically generated after #${{ github.event.pull_request.number }} was merged.

            **Source PR:** ${{ github.event.pull_request.title }}

            ## Review checklist

            - [ ] Changes accurately reflect the merged PR
            - [ ] Documentation style is consistent
            - [ ] No important details were missed
            - [ ] No existing content was incorrectly removed
            - [ ] CHANGELOG entry is correct

            ---
            *Generated by the documentation update workflow*
          branch: docs/auto-update-${{ github.event.pull_request.number }}
          delete-branch: true
          labels: |
            documentation
            automated
